name: Release Muzamin Studio (Multi-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 1. بناء نسخة Windows (x64 Release & Setup Installer)
  # ═══════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows Release & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^v') { $version = "v1.0.0" }
          $cleanVersion = $version.TrimStart('v')
          mkdir release_dist -ErrorAction SilentlyContinue

          # Run Inno Setup Compiler (pre-installed on windows-latest runner)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$cleanVersion" windows\installer\muzamin_setup.iss

      - name: Archive Windows Portable ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^v') { $version = "v1.0.0" }
          $zipName = "release_dist\Muzamin_Studio_${version}_Windows_Portable.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zipName

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release_dist/*

  # ═══════════════════════════════════════════════════════════════
  # 2. بناء نسخة macOS (Universal / x64 / ARM)
  # ═══════════════════════════════════════════════════════════════
  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Archive macOS Release
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ ! "$VERSION" =~ ^v ]]; then VERSION="v1.0.0"; fi
          ZIP_NAME="Muzamin_Studio_${VERSION}_macOS.zip"
          cd build/macos/Build/Products/Release
          zip -r "../../../../$ZIP_NAME" "Muzamin Studio.app" || zip -r "../../../../$ZIP_NAME" *.app
          cd ../../../..
          echo "MACOS_ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: Muzamin_Studio_*_macOS.zip

  # ═══════════════════════════════════════════════════════════════
  # 3. بناء نسخة Linux (x64 Release)
  # ═══════════════════════════════════════════════════════════════
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Bundle
        run: flutter build linux --release

      - name: Archive Linux Release
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ ! "$VERSION" =~ ^v ]]; then VERSION="v1.0.0"; fi
          TAR_NAME="Muzamin_Studio_${VERSION}_Linux_x64.tar.gz"
          tar -czvf "$TAR_NAME" -C build/linux/x64/release/bundle .
          echo "LINUX_TAR=$TAR_NAME" >> $GITHUB_ENV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: Muzamin_Studio_*_Linux_x64.tar.gz

  # ═══════════════════════════════════════════════════════════════
  # 4. تجميع وإطلاق الإصدار في GitHub Releases
  # ═══════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release files
        run: |
          mkdir -p release_assets
          cp windows-release/* release_assets/ || true
          cp macos-release/*.zip release_assets/ || true
          cp linux-release/*.tar.gz release_assets/ || true
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: Muzamin Studio ${{ github.ref_name }}
          body: |
            ## 🎙️ Muzamin Studio (أستوديو مُزامِن) - Official Release ${{ github.ref_name }}

            ### ✨ Key Features:
            - 📖 **Offline QPC V2 Madinah Quran Glyphs Engine** (604 pages, authentic page-by-page fonts).
            - 🎙️ **Multi-Segment Synchronization** (Quran verses, Prophetic Hadith, Chapters, Dhikr, Custom).
            - ⚡ **Ultra-Lightweight Sync Schema v2** with auto-calculated `juz` and `pageRange`.
            - 🔄 **Smart Preload & Undo Sync** (Ctrl+Z rewinds verse queue).
            - 📊 **Interactive Audio Waveform** with Latency Compensation.
            - 📦 **Multi-Format Export Studio**: JSON, WebVTT, SRT, Production-ready Dart Seed.
            - 🌐 **Multi-Language Support**: العربية, English, Soomaali.

            ### 📦 Download Packages:
            - **Windows (Installer - Recommended)**: `Muzamin_Studio_${{ github.ref_name }}_Windows_Setup.exe`
            - **Windows (Portable ZIP)**: `Muzamin_Studio_${{ github.ref_name }}_Windows_Portable.zip`
            - **macOS**: `Muzamin_Studio_${{ github.ref_name }}_macOS.zip`
            - **Linux**: `Muzamin_Studio_${{ github.ref_name }}_Linux_x64.tar.gz`
          draft: false
          prerelease: false
